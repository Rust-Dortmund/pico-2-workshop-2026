[package]
edition = "2024"
name = "rp2350-wifi-ble-controlled-led"
version = "0.1.0"

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [ "tcp", "udp", "dhcpv4", "medium-ethernet"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }

defmt = "1.1.1"
defmt-rtt = "1.0.0"

cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs", "bluetooth"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }

cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
critical-section = "1.2.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embedded-hal = "1"
embedded-hal-async = "1"

static_cell = "2.1.1"

picoserve = { version = "0.20.0", features = ["embassy"] }

trouble-host = { version = "0.8", features = ["peripheral", "gatt", "derive", "defmt"] }

# Published cyw43 0.7.0 still talks bt-hci 0.8. trouble-host 0.8 needs bt-hci 0.10
# (which depends on bt-hci-transport 0.1). Patch the Embassy stack from one git rev
# so path deps unify and cyw43 implements that transport.
# Not current main: later embassy-net dropped `proto-ipv4` (renamed `ipv4`), which
# picoserve 0.20 still requires. This pin is the newest with both bt-hci-transport
# and proto-ipv4: https://github.com/embassy-rs/embassy/commit/2d36ff0f8d7fbc3095412204f8f01dd2bcab6344
[patch.crates-io]
cyw43 = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }
embassy-net = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }
embassy-net-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git", rev = "2d36ff0f8d7fbc3095412204f8f01dd2bcab6344" }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
lto = 'fat'
overflow-checks = false
